name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test
        env:
          CI: true

      - run: npm run docs

      - name: Commit updated docs and coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ coverage/
          git diff --cached --quiet || git commit -m "chore: update docs and coverage [skip ci]"
          git push
